name: hostplane

# Shared configuration for the three application roles. They run the same image
# and the same settings; only the command differs.
x-app: &app
  build: .
  env_file: .env
  environment:
    HOSTPLANE_DATABASE_URL: postgresql+psycopg://hostplane:hostplane@postgres:5432/hostplane
    HOSTPLANE_REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hostplane
      POSTGRES_PASSWORD: hostplane
      POSTGRES_DB: hostplane
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostplane -d hostplane"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persistence is on because the broker holds queued provisioning jobs; losing
    # them on restart would strand instances in `pending`.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs migrations to completion before api/worker/beat are allowed to start,
  # so no role ever queries a schema that does not exist yet.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
      - -Q
      - provisioning,billing,maintenance,celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - beat
      - --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
