name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test:
    runs-on: ubuntu-latest

    # The suite runs against real PostgreSQL, not SQLite: the IPAM allocator
    # relies on FOR UPDATE SKIP LOCKED and the schema uses JSONB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hostplane
          POSTGRES_PASSWORD: hostplane
          POSTGRES_DB: hostplane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hostplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HOSTPLANE_TEST_DATABASE_URL: postgresql+psycopg://hostplane:hostplane@localhost:5432/hostplane_test
      HOSTPLANE_REDIS_URL: redis://localhost:6379/0
      HOSTPLANE_SECRET_KEY: ci-secret-not-for-production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Verify migrations apply and roll back cleanly
        env:
          HOSTPLANE_DATABASE_URL: postgresql+psycopg://hostplane:hostplane@localhost:5432/hostplane_migrations
        run: |
          PGPASSWORD=hostplane createdb -h localhost -U hostplane hostplane_migrations
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Check the models match the migrations
        env:
          HOSTPLANE_DATABASE_URL: postgresql+psycopg://hostplane:hostplane@localhost:5432/hostplane_migrations
        run: |
          # Fails if someone edits a model without generating a migration.
          alembic check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
