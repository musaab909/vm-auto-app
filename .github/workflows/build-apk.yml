name: Build water reminder APK

on:
  push:
    paths:
      - "water_reminder/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: water_reminder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk water-reminder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: water-reminder-apk
          path: water_reminder/water-reminder.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: water-reminder-build-${{ github.run_number }}
          name: مذكر شرب الماء - نسخة ${{ github.run_number }}
          prerelease: true
          files: water_reminder/water-reminder.apk
